# cava config for the Bongo Cat bar widget (pizza.dirty.bongocat).
#
# Raw spectrum output on stdout: 16 mono bars, low to high, one ascii
# frame per line. audio_monitor.py reads the frames and runs Noctalia's
# beat detector over them. Smoothing is kept raw and fast here on purpose,
# the feeder does its own smoothing, so cava must not smear the onsets.

[general]
framerate = 60
autosens = 1
bars = 16
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[input]
method = pipewire
source = auto

[smoothing]
monstercat = 0
noise_reduction = 0
